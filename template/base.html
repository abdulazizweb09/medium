<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    .medium-logo {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .article-card {
      transition: all 0.2s ease;
    }
    .article-card:hover {
      transform: translateY(-2px);
    }
  </style>

</head>
<body class="bg-white text-gray-900">
  <nav class="border-b border-gray-200 bg-white sticky top-0 z-50">
    <div class="max-w-full mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-2">
            <button onclick="toggleSidebar()" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg">
              <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <a href="#" class="medium-logo text-black">Medium</a>
          </div>
          
          <div class="hidden md:flex items-center bg-gray-100 rounded-full px-4 py-2 w-80 focus-within:w-96 transition-all">
            <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
            <input type="text" placeholder="Qidirish" 
                   class="flex-1 ml-3 bg-transparent outline-none text-sm">
          </div>
        </div>

        <div class="flex items-center gap-4">
          <button class="hidden sm:flex items-center gap-2 bg-black text-white px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-800 transition">
            <i class="fa-solid fa-qrcode"></i>
            <span>Get app</span>
          </button>
          
          <a href="/p/">
            <button class="hidden md:flex items-center gap-2 px-5 py-2 text-sm font-medium hover:bg-gray-100 rounded-full">
            <i class="fa-solid fa-pen-nib"></i>
            <span>Write</span>
          </button>
          </a>
          
          <button class="text-gray-600 hover:text-black transition">
            <i class="fa-solid fa-bell text-xl"></i>
          </button>
          
          <div class="w-8 h-8 from-purple-500 to-pink-500 rounded-full cursor-pointer">
            <img src="{{avatar}}" class="rounded-full" alt="">
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex max-w-full mx-auto">
    <div id="leftSidebar" class="hidden lg:block w-60 border-r border-gray-200 min-h-screen py-6 px-4 fixed">
      <div class="space-y-1">
        <a href="/" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium bg-gray-100 rounded-xl">
          <i class="fa-solid fa-house w-5"></i>
          <span>Home</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium hover:bg-gray-100 rounded-xl">
          <i class="fa-solid fa-book w-5"></i>
          <span>Library</span>
        </a>
        <a href="/profile/{{user.username}}" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium hover:bg-gray-100 rounded-xl">
          <i class="fa-solid fa-user w-5"></i>
          <span>Profile</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium hover:bg-gray-100 rounded-xl">
          <i class="fa-solid fa-newspaper w-5"></i>
          <span>Stories</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium hover:bg-gray-100 rounded-xl">
          <i class="fa-solid fa-chart-bar w-5"></i>
          <span>Stats</span>
        </a>
      </div>

      <div class="mt-8 px-4">
        <div class="text-xs uppercase font-semibold text-gray-500 mb-3">Following</div>
        <button class="flex items-center gap-2 text-sm text-gray-600 hover:text-black">
          <i class="fa-solid fa-plus"></i>
          <span>Find writers and publications</span>
        </button>
      </div>
    </div>
    {% block content %}
        {% endblock %}
    
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('leftSidebar');
      sidebar.classList.toggle('hidden');
    }
  </script>
</body>
</html>
