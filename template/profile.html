{% extends 'base.html' %}

{% block content %}

    <div class="flex-1 max-w-2xl mx-auto border-r border-gray-200 min-h-screen">
      <div class="px-6 pt-8">
        <div class="flex justify-between items-start">
          <div>
            <h1 class="text-4xl font-bold">{{user.username}}</h1>
          </div>
          <div class="w-24 h-24 bg-gray-200 rounded-full overflow-hidden border-4 border-white shadow-md">
            <img src="{{avatar}}" alt="Profile Picture" class="w-full h-full object-cover">
          </div>
        </div>

        <div class="flex gap-8 mt-10 border-b border-gray-200">
          <button class="pb-4 font-medium border-b-2 border-black text-black">Home</button>
          <button class="pb-4 font-medium text-gray-500 hover:text-gray-700 flex items-center gap-1">
            Activity 
          </button>
          <button class="pb-4 font-medium text-gray-500 hover:text-gray-700">About</button>
        </div>

        <div class="mt-8">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center">
                    <img src="{{avatar}}" class="rounded-full" alt="">
              </div>
              <div>
                <p class="text-sm text-gray-500">{{user.username}}</p>
              </div>
            </div>
            <button class="text-gray-400 hover:text-gray-600">
              <i class="fa-solid fa-ellipsis"></i>
            </button>
          </div>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-8 text-center">
            <p class="text-gray-500 text-lg">No stories</p>
            <p class="text-gray-400 text-sm mt-2">Articles you save will appear here</p>
          </div>
        </div>
      </div>
    </div>

    <div class="hidden xl:block w-80 py-8 pr-6">
      <div class="sticky top-20">
        <div class="text-center">
          <div class="w-28 h-28 mx-auto bg-gray-200 rounded-full overflow-hidden border-4 border-white shadow">
            <img src="{{avatar}}" alt="Profile" class="w-full h-full object-cover">
          </div>
          <h2 class="font-semibold mt-4">{{user.username}}</h2>
          <p class="text-gray-600 text-sm mt-1">dfsdqssaaaaaaf</p>
          <button class="mt-6 w-full bg-black text-white py-2.5 rounded-full font-medium hover:bg-gray-800 transition">
            Edit profile
          </button>
        </div>
      </div>
    </div>

    {% endblock %}
